[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "meshio>=5.3",
    "numpy>=1.26",
    "pandas>=2.1",
    "streamlit>=1.40",
    "tqdm>=4.66",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
