[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "streamlit>=1.40",
]

[project.optional-dependencies]
database = [
    "duckdb>=1.4",
    "pyarrow>=16",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
